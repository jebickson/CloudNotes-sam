AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudNotes API

Globals:
  Function:
    Timeout: 30

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64
        
      Environment:
        Variables:
          TABLE_NAME: CloudNotes

      Policies:
        - DynamoDBCrudPolicy:
            TableName: CloudNotes

      Events:
        Root:
          Type: Api
          Properties:
            Path: /
            Method: ANY

        Notes:
          Type: Api
          Properties:
            Path: /notes
            Method: ANY

        NotesById:
          Type: Api
          Properties:
            Path: /notes/{id}
            Method: ANY

Outputs:
  CloudNotesApi:
    Description: CloudNotes API
    Value: CloudNotes API configured
